<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clap ! — CR & Actions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --primary:#560A0F; --or:#EFB810; --muted:#7a6f63; --signal:#c0392b; --bg:#f3ede1; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:#2b2b2b; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding-top:env(safe-area-inset-top,0px); }
  .hidden{ display:none !important; }
  .panel{ background:#fff; border:1px solid rgba(86,10,15,.10); border-radius:12px; }
  .add-btn{ background:var(--primary); color:#fff; border:none; border-radius:9px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .add-btn.sm{ padding:5px 10px; font-size:12.5px; border-radius:8px; }
  .add-btn.ghost{ background:#fff; color:var(--primary); border:1px solid rgba(86,10,15,.25); }
  .sec-title{ font-size:18px; font-weight:800; color:var(--primary); margin:2px 0 8px; }
  .sec-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#b3541e; margin-bottom:2px; }
  .sec-note{ font-size:12.5px; color:var(--muted); }
  .edit-hint{ font-size:11.5px; color:var(--muted); }
  /* classes utilisées par le module AIC (mêmes définitions que le Cockpit) */
  .field-label{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#6b5b58; margin-bottom:6px; display:block; }
  .sub-cell{ font-size:12px; color:#6b5b58; }
  .pill{ font-size:11px; padding:2px 9px; border-radius:10px; font-weight:600; white-space:nowrap; }
  .p-grey{ background:#e8e4da; color:var(--muted); }
  table{ border-collapse:collapse; width:100%; }
  /* en-tête */
  .clap-head{ background:linear-gradient(90deg,#560A0F,#7a1620); color:#fff; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; }
  .clap-logo{ font-size:22px; font-weight:900; letter-spacing:.04em; }
  .clap-logo span{ color:var(--or); }
  .clap-wrap{ max-width:1100px; margin:0 auto; padding:16px 14px 60px; }
  /* onglets (visibles seulement pour les personnes qui ont accès à l'AIC) */
  .clap-tabs{ display:flex; gap:2px; background:#4a080c; padding:0 14px; overflow-x:auto; }
  .clap-tab{ background:transparent; color:#fff; border:0; border-bottom:3px solid transparent; padding:10px 16px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; opacity:.75; white-space:nowrap; }
  .clap-tab:hover{ opacity:1; }
  .clap-tab.on{ opacity:1; border-bottom-color:var(--or); }
  .clap-tab:focus-visible{ outline:3px solid var(--or); outline-offset:-3px; }
  /* login */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .login-card{ background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.15); padding:28px 26px; max-width:380px; width:100%; }
  .login-card h1{ font-size:26px; font-weight:900; color:var(--primary); margin:0 0 2px; }
  .login-card h1 span{ color:var(--or); }
  .login-card .sub{ font-size:13px; color:var(--muted); margin-bottom:18px; }
  .login-card input{ width:100%; font-size:14px; padding:10px 12px; border:1px solid rgba(86,10,15,.25); border-radius:9px; margin-bottom:10px; }
  #cerr{ font-size:12.5px; color:var(--signal); min-height:16px; margin-bottom:8px; }

  /* ---------- Adaptation smartphone ---------- */
  @media (max-width: 640px){
    .clap-head{ padding:10px 12px; flex-wrap:wrap; gap:8px; }
    .clap-logo{ font-size:18px; }
    #cwho{ display:none; }
    .clap-wrap{ padding:12px 10px 64px; }
    .sec-title{ font-size:16px; }
    .panel{ border-radius:10px; }
    /* Matrice Eisenhower : une seule colonne */
    #view div[style*="grid-template-columns:1fr 1fr"]{ grid-template-columns:1fr !important; }
    /* Kanban 5 colonnes : colonnes empilées */
    #view div[style*="grid-template-columns:repeat(5,1fr)"]{ display:block !important; }
    #view div[style*="grid-template-columns:repeat(5,1fr)"] > div{ margin-bottom:12px !important; }
    /* Champs de formulaire : un par ligne */
    #view label[style*="min-width"]{ min-width:100% !important; flex:1 1 100% !important; }
    #view input[style*="min-width:200px"]{ min-width:100% !important; }
    #view input[type="date"], #view select, #view textarea, #view input[type="text"], #view input[type="email"]{ max-width:100%; box-sizing:border-box; }
    /* Tableaux (rendu Markdown) : défilement horizontal */
    #view table{ display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  }
</style>
</head>
<body>
  <!-- Config Supabase (même projet que le cockpit -> synchro) -->
  <script>
    window.SUPABASE_URL = "https://omftqlvkmjlxoinruayr.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_RgKYatx7zHx_SJvrvoyt2w_fXhLKQ1w";
    window.CLAP_HOST = true;   // indique au module AIC (public/shared/aic-espaces.js) qu'il tourne dans Clap!, pas dans le Cockpit
  </script>

  <div id="clogin" class="login-wrap">
    <div class="login-card">
      <h1>Clap <span>!</span></h1>
      <div class="sub">Comptes-rendus & plan d'action — Kaizen Way</div>
      <input id="email" type="email" placeholder="e-mail" autocomplete="username">
      <input id="pw" type="password" placeholder="mot de passe" autocomplete="current-password">
      <div id="cerr"></div>
      <button class="add-btn" style="width:100%;padding:11px;font-size:15px;" onclick="doLogin()">Se connecter</button>
    </div>
  </div>

  <div id="capp" class="hidden">
    <div class="clap-head">
      <div class="clap-logo">Clap <span>!</span></div>
      <div style="display:flex;align-items:center;gap:12px;font-size:13px;">
        <span id="cwho"></span>
        <button class="add-btn sm ghost" onclick="logout()" style="color:#fff;border-color:rgba(255,255,255,.5);background:transparent;">Se déconnecter</button>
      </div>
    </div>
    <div class="clap-tabs hidden" id="ctabs" role="tablist" aria-label="Sections">
      <button type="button" class="clap-tab on" id="ctab_cr" role="tab" aria-selected="true" onclick="clapTab('cr')">Comptes-rendus &amp; Actions</button>
      <button type="button" class="clap-tab" id="ctab_aic" role="tab" aria-selected="false" onclick="clapTab('aic')">AIC</button>
    </div>
    <div class="clap-wrap"><div id="view"></div></div>
  </div>

  <!-- Auth + globals fournis à cr-actions.js -->
  <script>
    let SB = null;
    let SB_SESSION = null;
    let CURRENT_ROLE = 'eric';
    let CURRENT_EMAIL = '';

    function initSupabase(){
      if(SB) return SB;
      if(!window.supabase || !window.SUPABASE_URL) return null;
      SB = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      return SB;
    }

    function roleFromAccess(access, email){
  if(!access) return 'paul';
  if(access.is_admin === true) return 'eric';
  var r = (access.role || '').toLowerCase().trim();
  var map = {
    'direction':'eric','eric':'eric','cto':'eric','si':'eric',
    'commerce':'paul','paul':'paul',
    'mktg et produit':'juliette','marketing':'juliette','marketing & communication':'juliette','communication':'juliette','juliette':'juliette',
    'méthodes':'audrey','methodes':'audrey','réalisation & compétences':'audrey','realisation':'audrey','audrey':'audrey',
    'rh':'sabrine','sabrine':'sabrine',
    'administration des affaires':'najoua','administration':'najoua','finance & admin':'najoua','finance':'najoua','najoua':'najoua',
    'consultant':'consultant'
  };
  if(map[r]) return map[r];
  var e = (email||'').toLowerCase();
  if(e.startsWith('paul')) return 'paul';
  if(e.startsWith('audrey')) return 'audrey';
  if(e.startsWith('juliette')) return 'juliette';
  if(e.startsWith('sabrine')) return 'sabrine';
  if(e.startsWith('najoua')) return 'najoua';
  return 'paul';
}

    async function doLogin(){
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pw = document.getElementById('pw').value;
      const err = document.getElementById('cerr');
      if(!email || !pw){ err.textContent = "Renseignez e-mail et mot de passe."; return; }
      const sb = initSupabase();
      if(!sb){ err.textContent = "Configuration Supabase absente."; return; }
      err.textContent = "Connexion…";
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if(error){ err.textContent = "Échec : " + error.message; return; }
      SB_SESSION = data.session; CURRENT_EMAIL = email;
      try { const { data: acc } = await sb.from('user_access').select('is_admin, role').eq('email', email).maybeSingle(); CURRENT_ROLE = roleFromAccess(acc, email); }
      catch(e){ CURRENT_ROLE = roleFromAccess(null, email); }
      document.getElementById('cwho').textContent = email;
      document.getElementById('clogin').classList.add('hidden');
      document.getElementById('capp').classList.remove('hidden');
      err.textContent = "";
      const wantAic = location.hash === '#aic';   // lien direct vers l'AIC (favori, raccourci)
      if(!wantAic && window.renderPlanAction) window.renderPlanAction('view');
      await initTabs(wantAic);
    }

    /* ---------- Onglets : Comptes-rendus & Actions (par défaut) | AIC (si accès : CEO ou membre d'un espace) ---------- */
    let CLAP_TAB = 'cr';
    function paintTabs(){
      ['cr','aic'].forEach(function(t){ const b = document.getElementById('ctab_'+t); if(!b) return; b.classList.toggle('on', CLAP_TAB===t); b.setAttribute('aria-selected', CLAP_TAB===t ? 'true' : 'false'); });
    }
    async function initTabs(wantAic){
      CLAP_TAB = 'cr'; paintTabs();
      const bar = document.getElementById('ctabs'); bar.classList.add('hidden');
      let ok = false;
      try { ok = !!(window.clapAIC && await window.clapAIC.access()); } catch(e){ ok = false; }
      if(ok && CURRENT_EMAIL){ bar.classList.remove('hidden'); if(wantAic){ clapTab('aic'); return; } }
      if(wantAic && window.renderPlanAction) window.renderPlanAction('view');   // pas d'accès AIC : Clap! s'affiche comme avant
    }
    function clapTab(t){
      if(CLAP_TAB === 'aic' && t !== 'aic' && window.clapAIC && window.clapAIC.busy() && !confirm("Une AIC est en cours. Quitter l'onglet AIC ? Le chrono continue : revenez sur l'onglet AIC pour la terminer.")) return;
      CLAP_TAB = t; paintTabs();
      if(t === 'aic'){ try { history.replaceState(null, '', '#aic'); } catch(e){} if(window.clapAIC) window.clapAIC.mount(); }
      else { try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} if(window.renderPlanAction) window.renderPlanAction('view'); }
    }

    async function logout(){
      try { if(SB) await SB.auth.signOut(); } catch(e){}
      SB_SESSION = null; CURRENT_EMAIL = '';
      try { if(window.clapAIC) window.clapAIC.reset(); } catch(e){}
      CLAP_TAB = 'cr'; document.getElementById('ctabs').classList.add('hidden');
      try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}   // la déconnexion remet l'adresse à zéro (plus de #aic)
      document.getElementById('capp').classList.add('hidden');
      document.getElementById('clogin').classList.remove('hidden');
      document.getElementById('pw').value=''; document.getElementById('cerr').textContent='';
    }

    // Entrée avec la touche Entrée
    document.addEventListener('keydown', function(e){ if(e.key==='Enter' && !document.getElementById('clogin').classList.contains('hidden')) doLogin(); });
  </script>

  <!-- Module partagé (source unique cockpit <-> Clap) -->
  <script src="/shared/cr-actions.js?v=7"></script>
  <!-- Module AIC partagé (même fichier que le Cockpit : mêmes données, mêmes droits) -->
  <script src="/shared/aic-espaces.js?v=3"></script>
</body>
</html>
