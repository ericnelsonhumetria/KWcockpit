<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  window.CEREBRO_SB = window.supabase.createClient(
    "https://omftqlvkmjlxoinruayr.supabase.co",
    "sb_publishable_RgKYatx7zHx_SJvrvoyt2w_fXhLKQ1w"
  );
  // Sous-onglets autorises selon le role recu du Cockpit (UX ; l'isolation reelle = RLS Brique B)
  (function(){
    var role = new URLSearchParams(location.search).get('role') || '';
    var subsParam = new URLSearchParams(location.search).get('cerebro');
    var map = { eric:['comptes','evenements','talents'], direction:['comptes','evenements','talents'],
                paul:['comptes'], juliette:['evenements'], communication:['evenements'], sabrine:['talents'] };
    window.CEREBRO_ALLOWED = (subsParam!==null) ? (subsParam ? subsParam.split(',') : []) : (map[role] || ['comptes','evenements']);
  })();
  // ── Stockage CEREBRO : Supabase (remplace localStorage) ─────────────────────
  // Même interface que window.storage (get/set/delete/list) : le code React ne change pas.
  // Données d'équipe (Business, Events) → cerebro_team_store, partagées selon le rôle.
  // Données People (relations LinkedIn, vivier…) → cerebro_user_store, privées à chacun.
  // Une copie locale est gardée en secours ; si Supabase échoue, un bandeau le signale.
  (function(){
    var PRIVATE = ['humetria:radar:talents','humetria:radar:playbook','humetria:radar:network','humetria:radar:netkw','humetria:radar:contacts'];
    var isPrivate = function(k){ return PRIVATE.indexOf(k) >= 0; };
    var sb = function(){ return window.CEREBRO_SB; };
    function lsGet(k){ try{ var v = localStorage.getItem(k); return v === null ? null : { key:k, value:v }; }catch(e){ return null; } }
    function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
    function banner(msg){
      try{
        var id = 'cerebro-sync-banner', el = document.getElementById(id);
        if(!el){ el = document.createElement('div'); el.id = id;
          el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 14px;border-radius:8px;'
            + 'background:#3a1d1f;border:1px solid #8A2B2F;color:#F2ECE3;font:13px Inter,system-ui,sans-serif;';
          document.body.appendChild(el); }
        el.textContent = '⚠ Synchronisation Supabase : ' + msg + ' — tes modifications sont gardées sur ce poste uniquement.';
      }catch(e){}
    }
    var uidCache = null;
    async function uid(){
      if(uidCache) return uidCache;
      var s = await sb().auth.getSession();
      uidCache = s && s.data && s.data.session ? s.data.session.user.id : null;
      return uidCache;
    }
    function table(k){ return isPrivate(k) ? 'cerebro_user_store' : 'cerebro_team_store'; }
    var timers = {}, latest = {}, chain = {};
    async function push(k, v){
      try{
        var u = await uid(); if(!u) throw new Error('session absente');
        var row = { key:k, value: JSON.parse(v) };
        if(isPrivate(k)) row.user_id = u;
        var r = await sb().from(table(k)).upsert(row, { onConflict: isPrivate(k) ? 'user_id,key' : 'key' });
        if(r.error) throw r.error;
        var el = document.getElementById('cerebro-sync-banner'); if(el) el.remove();
        return { key:k, value:v };
      }catch(e){ console.warn('[cerebro] écriture', k, e); banner((e && e.message) || 'écriture refusée'); return null; }
    }
    window.storage = {
      get: async function(k){
        var local = lsGet(k);
        try{
          var u = await uid(); if(!u) return local;
          var q = sb().from(table(k)).select('value').eq('key', k);
          if(isPrivate(k)) q = q.eq('user_id', u);
          var r = await q.maybeSingle();
          if(r.error) throw r.error;
          if(r.data){
            var remote = JSON.stringify(r.data.value);
            // 1re ouverture après migration : la copie locale divergente est mise de côté, jamais écrasée sans trace
            if(local && local.value !== remote && !localStorage.getItem(k + ':avant-supabase')) lsSet(k + ':avant-supabase', local.value);
            lsSet(k, remote);
            return { key:k, value:remote };
          }
          // Rien en base : migration de la copie locale (si elle existe)
          if(local){ await window.storage.set(k, local.value); }
          return local;
        }catch(e){ console.warn('[cerebro] lecture', k, e); banner((e && e.message) || 'lecture impossible'); return local; }
      },
      // Écritures regroupées par clé (300 ms) et envoyées dans l'ordre : la saisie au clavier
      // ne déclenche pas un envoi par frappe, et une valeur ancienne n'écrase jamais une plus récente.
      set: function(k, v){
        lsSet(k, v);
        latest[k] = v;
        clearTimeout(timers[k]);
        return new Promise(function(resolve){
          timers[k] = setTimeout(function(){
            chain[k] = (chain[k] || Promise.resolve()).then(function(){ return push(k, latest[k]); }).then(resolve, resolve);
          }, 300);
        });
      },
      delete: async function(k){
        try{ localStorage.removeItem(k); }catch(e){}
        try{
          var u = await uid(); var q = sb().from(table(k)).delete().eq('key', k);
          if(isPrivate(k)) q = q.eq('user_id', u);
          var r = await q; if(r.error) throw r.error;
          return { key:k, deleted:true };
        }catch(e){ banner((e && e.message) || 'suppression refusée'); return null; }
      },
      list: async function(prefix){
        try{
          var u = await uid();
          var a = await sb().from('cerebro_team_store').select('key');
          var b = await sb().from('cerebro_user_store').select('key').eq('user_id', u);
          var ks = [].concat(a.data || [], b.data || []).map(function(x){ return x.key; })
            .filter(function(kk){ return !prefix || kk.indexOf(prefix) === 0; });
          return { keys: ks };
        }catch(e){ return { keys: [] }; }
      }
    };
  })();
  Babel.registerPreset('kwreact', { presets: [ [Babel.availablePresets['react'], { runtime: 'classic' }] ] });
</script>

const NET_V = {
  gemba: { oui: 100, partielle: 55, non: 15 },

};
function netScore(tags) { let s = 0; for (const k in NET_W) s += NET_W[k] * (NET_V[k][tags?.[k]] ?? 50); return Math.round(s); }

const AFFINITY = [
  { w: 100, kw: ["excellence op", "amélioration continue", "lean", "continuous improvement", "gemba", "kaizen", "wcm", "world class manufacturing", "tpm", "black belt", "green belt", "six sigma"] },

  { w: 55, kw: ["responsable production", "responsable industriel", "supply chain", "consultant", "coach", "opérations", "operations", "production", "qhse", "qse", "manufacturing"] },
];
function affinityScore(position) {
  const p = (position || "").toLowerCase();
  let best = 0, hits = 0;
  for (const tier of AFFINITY) for (const k of tier.kw) if (p.includes(k)) { best = Math.max(best, tier.w); hits++; }
  if (!best) return 30;
  return Math.min(100, best + Math.min(15, (hits - 1) * 5));
}

let searchDegraded = false;
// meta (optionnel) : { requireSearch, maxUses, degraded } — propre à chaque appel.
async function callClaude(system, userContent, useSearch = true, maxTokens = 1000, meta = null) {
  async function attempt(withSearch) {
    const body = { model: "claude-sonnet-4-6", max_tokens: maxTokens, system, messages: [{ role: "user", content: userContent }] };
    if (withSearch) { const tool = { type: "web_search_20250305", name: "web_search" }; if (meta && meta.maxUses) { tool.max_uses = meta.maxUses; tool.user_location = { type: "approximate", country: "FR" }; } body.tools = [tool]; }
    const headers = { "Content-Type": "application/json" };
    try {
      const s = CEREBRO_SB && (await CEREBRO_SB.auth.getSession());
      const tok = s && s.data && s.data.session && s.data.session.access_token;
      if (tok) headers["Authorization"] = "Bearer " + tok;
    } catch (e) {}
    const response = await fetch("/.netlify/functions/cerebro-claude", {
      method: "POST", headers: headers, body: JSON.stringify(body),
    });
    if (!response.ok) {
      let detail = ""; try { detail = (await response.text()).slice(0, 220); } catch (e) {}
      throw new Error(`API ${response.status} ${detail}`);
    }
    const data = await response.json();
    if (data.error) throw new Error(data.error.message || "erreur API");
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
    if (!text) throw new Error("réponse vide du modèle");
    // Garde-fou : un agent qui DOIT chercher sur le web mais n'a fait aucune recherche est un échec, pas un résultat.
    if (withSearch && meta && meta.requireSearch) {
      const n = (data.usage && data.usage.server_tool_use && data.usage.server_tool_use.web_search_requests) || (data.content || []).filter(b => b.type === "server_tool_use").length;
      if (!n) throw new Error("NO_SEARCH");
    }
    return text;
  }
  async function withRetry(withSearch, tries) {
    let lastErr;
    for (let i = 0; i < tries; i++) {
      try { return await attempt(withSearch); }
      catch (e) { lastErr = e; if (e && e.message === "NO_SEARCH") throw e; await new Promise(r => setTimeout(r, 400 * (i + 1))); }
    }
    throw lastErr;
  }
  searchDegraded = false;
  if (!useSearch) return withRetry(false, 3);            // 3 essais (gère un 500 passager)
  try { return await withRetry(true, 2); }               // 2 essais avec recherche
  catch (e) { if (meta && meta.requireSearch) throw e; searchDegraded = true; if (meta) meta.degraded = true; return withRetry(false, 2); } // repli sans recherche
}

function parseObject(text) {
  let t = text.replace(/```json/gi, "").replace(/```/g, "").trim();
  const s = t.indexOf("{");
  if (s < 0) throw new Error("JSON introuvable dans la réponse");
  t = t.slice(s);
  const e = t.lastIndexOf("}");
  if (e > 0) { try { return JSON.parse(t.slice(0, e + 1)); } catch (_) {} }
  return JSON.parse(closeTruncatedJSON(t)); // JSON tronqué : on répare
}
function closeTruncatedJSON(t) {
  // dernier séparateur/fermeture hors chaîne = point de coupe sûr
  let inStr = false, esc = false, cut = -1;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inStr) { if (esc) esc = false; else if (c === "\\") esc = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === "," || c === "}" || c === "]") cut = i;
  }
  if (cut < 0) throw new Error("JSON irrécupérable");
  let out = t.slice(0, t[cut] === "," ? cut : cut + 1); // si virgule, on la retire
  const st = []; inStr = false; esc = false;
  for (let i = 0; i < out.length; i++) {
    const c = out[i];
    if (inStr) { if (esc) esc = false; else if (c === "\\") esc = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === "{") st.push("}");
    else if (c === "[") st.push("]");
    else if (c === "}" || c === "]") st.pop();
  }
  while (st.length) out += st.pop(); // ferme les structures ouvertes
  return out;
}
function parseObjects(text) {
  let t = text.replace(/```json/gi, "").replace(/```/g, "").trim();
  const s = t.indexOf("["), e = t.lastIndexOf("]");
  if (s >= 0 && e > s) { try { const a = JSON.parse(t.slice(s, e + 1)); if (Array.isArray(a)) return a; } catch (_) {} }
  const objs = []; let depth = 0, start = -1;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (ch === "{") { if (depth === 0) start = i; depth++; }
    else if (ch === "}") { depth--; if (depth === 0 && start >= 0) { try { objs.push(JSON.parse(t.slice(start, i + 1))); } catch (_) {} start = -1; } }
  }
  if (objs.length === 0) throw new Error("aucune fiche exploitable dans la réponse");
  return objs;
}
const clamp = n => Math.max(0, Math.min(100, Math.round(Number(n) || 0)));

// ── Scoring signaux : déterministe, transparent, recalculé à chaque changement de poids ──
const normCo = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/\b(groupe|group|sa|sas|se|ag|gmbh|holding)\b/g, "").replace(/[^a-z0-9]/g, "");
const libIndex = lib => Object.fromEntries(lib.map(s => [s.id, s]));
// Fraîcheur : ≤ 3 mois 100 %, ≤ 6 mois 70 %, ≤ 12 mois 40 %, au-delà 15 % ; date inconnue 30 %.
function recency(dateStr) {
  const t = Date.parse(dateStr || "");
  if (!dateStr || isNaN(t)) return 0.3;
  const d = (Date.now() - t) / 86400000;
  if (d < -31) return 0.3; // date future = suspecte
  return d <= 92 ? 1 : d <= 183 ? 0.7 : d <= 366 ? 0.4 : 0.15;
}
// Un type de signal ne compte qu'une fois (sa meilleure occurrence) ; signal non sourcé = demi-poids.
function signalScoreOf(signals, libMap) {
  const best = {};
  for (const s of signals || []) {
    const w = Number(libMap[s.type]?.weight) || 0;
    const c = w * recency(s.date) * (s.url ? 1 : 0.5);
    best[s.type] = Math.max(best[s.type] || 0, c);
  }
  return clamp(Object.values(best).reduce((a, b) => a + b, 0));
}
// Priorité = 60 % timing (signaux) + 40 % fit structurel ; fit inconnu = 50.
const priorityOf = (p, libMap) => Math.round(0.6 * signalScoreOf(p.signals, libMap) + 0.4 * (p.fit == null ? 50 : p.fit));
function consolidateSignals(raw, lib) {
  const libMap = libIndex(lib);
  const by = new Map();
  for (const s of raw) {
    if (!s || !s.company || !libMap[s.type]) continue;
    const k = normCo(s.company);
    if (!k) continue;
    if (!by.has(k)) by.set(k, { company: String(s.company).trim(), signals: [] });
    const e = by.get(k);
    const fact = String(s.fact || "").trim();
    if (e.signals.some(x => x.type === s.type && x.fact.slice(0, 40) === fact.slice(0, 40))) continue;
    e.signals.push({ type: s.type, fact, date: String(s.date || ""), site: String(s.site || ""), url: /^https?:\/\//.test(s.url || "") ? s.url : "" });
  }
  return [...by.values()].map(e => ({ ...e, signalScore: signalScoreOf(e.signals, libMap) }));
}
// Un compte issu de l'exploration ICP (sans signal capté) entre dans la même liste :
// timing = 0 tant qu'aucun agent n'a capté de signal → priorité plafonnée à 40 (« surveiller »).
function candToProspect(c) {
  return {
    company: c.company, signals: [], fit: c.score == null ? null : clamp(c.score), multisite: null,
    sites: "", sector: c.sector || "", region: c.region || "", need: c.why || "", offer: "",
    entry_persona: c.entry_persona || "", watch: Array.isArray(c.watch) ? c.watch : [], origin: "icp", ts: Date.now(),
  };
}
function mergeProspects(incoming, existing) {
  const map = new Map(existing.map(p => [normCo(p.company), p]));
  for (const p of incoming) {
    const k = normCo(p.company);
    const old = map.get(k);
    if (!old) { map.set(k, p); continue; }
    const seen = new Set(p.signals.map(s => s.type + "|" + s.fact.slice(0, 40)));
    map.set(k, {
      ...old, ...Object.fromEntries(Object.entries(p).filter(([, v]) => v !== "" && v != null && !(Array.isArray(v) && !v.length))),
      signals: [...p.signals, ...(old.signals || []).filter(s => !seen.has(s.type + "|" + s.fact.slice(0, 40)))],
      origin: p.signals.length || (old.signals || []).length ? "signaux" : (p.origin || old.origin),
      feedback: old.feedback || p.feedback,
    });
  }
  return [...map.values()];
}

  async function runSignals() {
    if (sigScanning) return;
    setSigScanning(true); setSigErr(""); setSigInfo("");
    const meta = { degraded: false };
    try {
      const exclude = [...new Set([...known, ...accounts.map(a => a.company), ...feedback.filter(f => f.verdict === "noise").map(f => f.company)])];
      const excl = new Set(exclude.map(normCo));
      const userMsg = focus.trim() ? `Focus : ${focus.trim()}` : "Balaye large : groupes industriels multi-sites en France et pays francophones.";
      const fams = SIGNAL_FAMILIES.filter(f => siglib.some(s => s.family === f.key && Number(s.weight) > 0));
      if (!fams.length) throw new Error("tous les poids de la bibliothèque sont à 0");
      let done = 0;
      setSigStage(`Capteurs : 0/${fams.length}…`);
      const results = await Promise.allSettled(fams.map(f =>
        callClaude(sensorPrompt(f, exclude), userMsg, true, 1800, { requireSearch: true, maxUses: 5 }).then(t => {
          done++; setSigStage(`Capteurs : ${done}/${fams.length}…`);
          return parseObjects(t);
        })
      ));
      const failed = results.filter(r => r.status === "rejected").length;
      const raw = results.filter(r => r.status === "fulfilled").flatMap(r => r.value)
        .filter(s => s && s.company && !excl.has(normCo(s.company)));
      const noSearch = results.filter(r => r.status === "rejected" && r.reason && r.reason.message === "NO_SEARCH").length;
      if (noSearch === fams.length) throw new Error("recherche web désactivée côté serveur (variable Netlify CEREBRO_WEB_SEARCH). La veille ne fonctionne pas sans recherche : rien n'a été inventé. En attendant, utilise « Explorer par l'ICP ».");
      if (!raw.length) throw new Error(failed ? `${failed} capteur(s) en échec (recherche web absente ou délai dépassé), aucun signal exploitable` : "aucun signal récent trouvé — élargis le focus");

      const libMap = libIndex(siglib);
      const merged = consolidateSignals(raw, siglib).sort((a, b) => b.signalScore - a.signalScore).slice(0, 12);
      setSigStage(`Consolidation de ${merged.length} entreprises…`);
      const ctx = merged.map(m => `- ${m.company} : ${m.signals.map(s => `${libMap[s.type].name} (${s.date || "date ?"}) — ${s.fact}`).join(" | ")}`).join("\n");
      let fitMap = new Map();
      try {
        const fits = parseObjects(await callClaude(consolidatorPrompt(), ctx, true, 2400, meta));
        fitMap = new Map(fits.filter(f => f && f.company).map(f => [normCo(f.company), f]));
      } catch (e) { setSigErr("Consolidation partielle — fit et multi-sites non vérifiés (" + (e?.message || "erreur") + ")."); }

      let dropped = 0;
      const fresh = merged.map(m => {
        const f = fitMap.get(normCo(m.company)) || {};
        return {
          company: m.company, signals: m.signals,
          fit: f.fit == null || f.fit === "" ? null : clamp(f.fit),
          multisite: f.multisite === true ? true : f.multisite === false ? false : null,
          sites: f.sites || "", sector: f.sector || "", region: f.region || "",
          need: f.need || "", offer: f.offer || "", entry_persona: f.entry_persona || "", origin: "signaux", ts: Date.now(),
        };
      }).filter(p => { if (p.multisite === false) { dropped++; return false; } return true; });
      // fusion avec la liste existante : on garde l'historique des signaux et le feedback d'une même entreprise
      persistSigProspects(mergeProspects(fresh, sigProspects));
      const parts = [`${raw.length} signaux captés → ${fresh.length} prospects`];
      if (dropped) parts.push(`${dropped} écarté(s) car mono-site / hors cible`);
      if (failed) parts.push(`${failed} capteur(s) en échec`);
      setSigInfo(parts.join(" · ") + ".");
      if (meta.degraded) setSigErr("⚠ Recherche web indisponible pour au moins un agent — les signaux concernés ne sont pas temps réel. Réessaie plus tard.");
    } catch (e) { setSigErr("Veille impossible — " + (e?.message || "erreur inconnue")); }
    finally { setSigScanning(false); setSigStage(""); }

  function parseCSV(text) {
    const rows = []; let field = "", row = [], inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += c;
      } else if (c === '"') inQ = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(x => x && x.trim()));
  }

  function importContacts(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const rows = parseCSV(String(reader.result));
        if (!rows.length) throw new Error("CSV vide");
        let hIdx = rows.findIndex(r => r.some(c => /first name|prénom|position|job title|intitulé|poste|titre/i.test(c)));
        if (hIdx < 0) hIdx = 0;
        const header = rows[hIdx].map(h => h.trim().toLowerCase());
        const col = (...names) => header.findIndex(h => names.some(n => h === n || h.includes(n)));
        const iFirst = col("first name", "prénom"), iLast = col("last name", "nom de famille"), iName = col("full name", "name", "nom complet"), iPos = col("position", "job title", "intitulé", "poste", "titre"), iComp = col("company", "entreprise", "organisation", "société");
        const out = [];
        for (let r = hIdx + 1; r < rows.length; r++) {
          const row = rows[r];
          const name = (iName >= 0 ? (row[iName] || "") : [row[iFirst], row[iLast]].filter(Boolean).join(" ")).trim();
          if (!name) continue;
          out.push({ name, position: (iPos >= 0 ? (row[iPos] || "") : "").trim(), company: (iComp >= 0 ? (row[iComp] || "") : "").trim() });
        }
        if (!out.length) throw new Error("aucun contact lisible (colonnes nom/poste introuvables)");
        const map = new Map(contacts.map(c => [(c.name + "|" + c.company).toLowerCase(), c]));

        persistContacts(merged); setNetErr("");
        setImportMsg(out.length + " lus · " + merged.length + " contacts au total (sauvegardés).");
      } catch (err) { setNetErr("Import impossible — " + (err?.message || "format non reconnu")); }
    };
    reader.readAsText(file);
    e.target.value = "";

                  {ev.desc && <p className="hr-cb-why">{ev.desc}</p>}
                  {ev.why && <p className="hr-cb-persona">Impact : {ev.why}</p>}
                  {ev.verified ? (
                    <div style={{ marginTop: 8 }}>
                      <div className="hr-ev-grid">
                        {ev.dates && <div><span className="hr-ev-k">Dates</span>{ev.dates}{ev.edition ? ` (${ev.edition})` : ""}</div>}
                        {ev.location && <div><span className="hr-ev-k">Lieu</span>{ev.location}</div>}
                        {ev.deadline && <div><span className="hr-ev-k">Deadline</span><span style={{ color: "var(--amber)" }}>{ev.deadline}</span></div>}
                        {ev.cost && <div><span className="hr-ev-k">Coût</span>{ev.cost}</div>}
                        {ev.audience && <div style={{ gridColumn: "1 / -1" }}><span className="hr-ev-k">Audience</span>{ev.audience}</div>}
                        {ev.format_leverage && <div style={{ gridColumn: "1 / -1" }}><span className="hr-ev-k">Format à jouer</span>{ev.format_leverage}</div>}
                      </div>
                      {ev.opportunity && <p className="hr-cb-persona" style={{ marginTop: 8 }}><b style={{ color: "var(--paper)" }}>Opportunité :</b> {ev.opportunity}</p>}
                      {ev.recommendation && <p className="hr-cb-persona"><b style={{ color: "var(--paper)" }}>Reco :</b> {ev.recommendation}</p>}
                      {ev.url
                        ? <p className="hr-cb-persona" style={{ wordBreak: "break-all", marginTop: 4 }}><a href={ev.url} target="_blank" rel="noreferrer" style={{ color: "var(--cyan)" }}>{ev.url} ↗</a></p>
                        : <p className="hr-cb-persona" style={{ marginTop: 4 }}>Lien non confirmé — à chercher sur le site officiel.</p>}
                      {ev.vnote && <p className="hr-cb-persona" style={{ fontStyle: "italic" }}>{ev.vnote}</p>}
                    </div>
                  ) : (
                    ev.check && <p className="hr-cb-persona" style={{ color: "var(--amber)" }}>À vérifier : {ev.check}</p>
                  )}
                  <div className="hr-cb-actions">
                    <button className="hr-mini" onClick={() => verifyEvent(ev.name)} disabled={!!verifyingEvent}>
                      {verifyingEvent === ev.name ? <><span className="hr-spin" />…</> : (ev.verified ? "Revérifier ▸" : "Vérifier dates & lien ▸")}
                    </button>
                  </div>
                </div>
              );
            })}
            <p className="hr-caption">Impact = estimation de cadrage. « Vérifier » constitue le dossier : dates, lieu, deadline, coût, audience, opportunité et lien officiel. Les faits datés viennent de la recherche web — jamais inventés ; reconfirme une deadline avant de bloquer ton planning.</p>
          </div>
        )}

        </>)}

        {tab === "talents" && (<>

        {/* Import réseau */}
        <div className="hr-card cerebro">
          <p className="hr-cerebro-title">◎ CEREBRO PEOPLE</p>
          <p className="hr-cerebro-sub">Tes ex-clients, alumni et contacts des 50+ sites — là où tu as déjà vu qui fitte. Importe l'export de tes relations LinkedIn : ta donnée, pas du scraping.</p>
          <label className="hr-btn" style={{ display: "inline-block" }}>
            Importer un CSV (relations LinkedIn / HubSpot)
            <input type="file" accept=".csv,text/csv" onChange={importContacts} style={{ display: "none" }} />
          </label>
          <span style={{ marginLeft: 14 }}><button className="hr-link" onClick={() => setShowKw(v => !v)}>{showKw ? "masquer les mots-clés" : "mots-clés de filtrage ▸"}</button></span>
          {contacts.length > 0 && <span style={{ marginLeft: 14 }}><button className="hr-link" onClick={() => { persistContacts([]); setImportMsg(""); }}>vider les contacts</button></span>}
          {showKw && <textarea className="hr-textarea" style={{ minHeight: 80 }} value={netKeywords} onChange={e => persistNetKw(e.target.value)} placeholder="mots-clés de poste (un par ligne ou séparés par des virgules)" />}
          {netErr && <p className="hr-err">{netErr}</p>}
          {importMsg && <p className="hr-caption" style={{ color: "var(--cyan)", marginTop: 10 }}>{importMsg}</p>}
          <p className="hr-caption" style={{ marginTop: 10 }}>LinkedIn : Réglages → Confidentialité des données → Obtenir une copie de vos données → Connexions. Le CSV est lu sur ton appareil et sauvegardé localement (rien n'est envoyé en ligne). Réimporte d'autres fichiers pour les fusionner.</p>
        </div>

        {/* Contacts filtrés */}
        {contacts.length > 0 && (() => {
          const kws = netKeywords.split(/[\n,]/).map(s => s.trim().toLowerCase()).filter(Boolean);
          const inNet = new Set(network.map(n => n.id));
          const matches = contacts
            .filter(c => c.position && kws.some(k => c.position.toLowerCase().includes(k)) && !inNet.has((c.name + "|" + c.company).toLowerCase()))
            .map(c => ({ ...c, aff: affinityScore(c.position) }))
            .sort((a, b) => b.aff - a.aff);
          return (
            <div style={{ marginBottom: 16 }}>
              <p className="hr-section-title" style={{ padding: "0 4px" }}>{matches.length} contacts au profil ciblé · {contacts.length} importés</p>
              <p className="hr-caption" style={{ padding: "0 4px", marginBottom: 8 }}>Affinité = correspondance de l'intitulé avec le profil transfo/lean/excellence-op. C'est un tri pour prioriser qui regarder — pas un verdict. Le vrai fit se note dans le Vivier.</p>
              {matches.slice(0, 60).map((c, i) => {
                const col = talentVerdict(c.aff).color;
                return (
                  <div key={i} className="hr-cb" style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <span title="Affinité de poste" style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 15, fontWeight: 600, color: col, width: 30, textAlign: "right", flexShrink: 0 }}>{c.aff}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="hr-cb-name">{c.name}</div>
                      <div className="hr-cb-meta" style={{ color: "var(--mute)" }}>{[c.position, c.company].filter(Boolean).join(" · ")}</div>
                    </div>
                    <button className="hr-mini" onClick={() => addToNetwork(c)}>+ Vivier</button>
                  </div>
                );
              })}
              {matches.length > 60 && <p className="hr-caption">Affichage des 60 mieux classés — affine les mots-clés pour resserrer.</p>}
              {matches.length === 0 && <p className="hr-caption">Aucun contact ne matche les mots-clés. Élargis-les, ou vérifie que le CSV contient bien une colonne de poste.</p>}
            </div>
          );
        })()}

        {/* Vivier scoré terrain */}
        {network.length > 0 && (
          <div>
            <p className="hr-section-title" style={{ padding: "0 4px" }}>Vivier · {network.length}</p>
            {[...network].sort((a, b) => netScore(b.tags) - netScore(a.tags)).map(n => {
              const sc = netScore(n.tags); const v = talentVerdict(sc);
              return (
                <div key={n.id} className="hr-cb">
                  <div className="hr-cb-head">
                    <span className="hr-cb-score" style={{ color: v.color }}>{sc}</span>
                    <div className="hr-cb-mid">
                      <div className="hr-cb-name">{n.name}</div>
                      <div className="hr-cb-meta" style={{ color: "var(--mute)" }}>{[n.position, n.company].filter(Boolean).join(" · ")}</div>
                    </div>
                    <span className="hr-badge" style={{ color: v.color, background: v.color + "22" }}>{v.label}</span>
                    <button className="hr-del" onClick={() => removeNetwork(n.id)} title="Retirer">×</button>
                  </div>
                  {NET_FIELDS.map(f => (
                    <div key={f.key} className="hr-nettag">
                      <span className="hr-nettag-k">{f.label}</span>
                      <div className="hr-seg">
                        {f.opts.map(o => <button key={o} className={n.tags[f.key] === o ? "on" : ""} onClick={() => setTag(n.id, f.key, o)}>{o}</button>)}
                      </div>
                    </div>
                  ))}
                  <div className="hr-cb-actions">
                    <button className="hr-mini" onClick={() => draftReconnect(n.id)} disabled={draftingId === n.id}>
                      {draftingId === n.id ? <><span className="hr-spin" />…</> : (n.draft ? "Régénérer la reprise ▸" : "Rédiger la reprise de contact ▸")}
                    </button>
                  </div>
                  {Array.isArray(n.draft) && n.draft.map((d, i) => (
                    <div key={i} className="hr-variant">
                      <p className="hr-variant-label"><span>{d.label}</span><button className="hr-copy" onClick={() => copyText("nd" + n.id + i, d.body)}>{copied === "nd" + n.id + i ? "copié ✓" : "copier"}</button></p>
                      <p className="hr-variant-body">{d.body}</p>
                    </div>
                  ))}
                </div>
              );
            })}
            <p className="hr-caption">Score = TON évaluation terrain (tu as vu ces gens travailler), pas une devinette de l'IA. Remplace tout [marqueur] par votre projet réel avant d'envoyer.</p>
          </div>
        )}

        </>)}

        {/* Données — sauvegarde / restauration */}
        <div className="hr-card" style={{ marginTop: 16 }}>
          <p className="hr-section-title">Sauvegarde des données</p>
          <p className="hr-caption" style={{ margin: "0 0 12px 0" }}>Tes données sont enregistrées en continu dans cet outil et rechargées à l'ouverture — rien n'est perdu entre les sessions. L'export ci-dessous est une copie de secours (changement de version, reprise ailleurs). Le téléchargement de fichier est parfois bloqué dans l'app : dans ce cas, copie simplement le texte.</p>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
            <button className="hr-btn ghost" style={{ marginTop: 0 }} onClick={exportData} disabled={!(accounts.length || candidates.length || events.length || network.length || contacts.length)}>Exporter (sauvegarde) ▸</button>
            <label className="hr-btn ghost" style={{ marginTop: 0, display: "inline-block" }}>
              Importer un fichier
              <input type="file" accept="application/json,.json" onChange={handleImport} style={{ display: "none" }} />
            </label>
            <button className="hr-link" onClick={clearAll}>tout effacer</button>
          </div>
          {exportText && (
            <div style={{ marginTop: 14 }}>
              <p className="hr-nettag-k">Sauvegarde — copie ce texte dans un fichier .json</p>
              <textarea className="hr-textarea" readOnly value={exportText} onFocus={e => e.target.select()} style={{ minHeight: 120, fontFamily: "'IBM Plex Mono',monospace", fontSize: 11 }} />
              <button className="hr-mini" onClick={() => copyText("exp", exportText)}>{copied === "exp" ? "copié ✓" : "Copier la sauvegarde"}</button>
            </div>
          )}
          <div style={{ marginTop: 14 }}>
            <p className="hr-nettag-k">Restaurer depuis un texte collé</p>
            <textarea className="hr-textarea" value={importText} onChange={e => setImportText(e.target.value)} placeholder="Colle ici le contenu d'une sauvegarde JSON…" style={{ minHeight: 70, fontFamily: "'IBM Plex Mono',monospace", fontSize: 11 }} />
            <button className="hr-mini" onClick={importFromText} disabled={!importText.trim()}>Restaurer ▸</button>
          </div>
          {dataMsg && <p className="hr-caption" style={{ margin: "12px 4px 0", color: "var(--cyan)" }}>{dataMsg}</p>}
        </div>

      </div>
    </div>
  );
}


async function cerebroBoot(){
  var mount = document.getElementById('root');
  var session = null;
  try { var s = await CEREBRO_SB.auth.getSession(); session = s && s.data ? s.data.session : null; } catch(e){}
  if(!session){
    mount.innerHTML = '<div style="max-width:520px;margin:80px auto;padding:24px;'
      + 'font-family:Inter,system-ui,sans-serif;color:#F2ECE3;background:#1a1214;'
      + 'border:1px solid #3a2b2e;border-radius:12px;line-height:1.6;">'
      + '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:.08em;'
      + 'text-transform:uppercase;color:#9c8f88;margin-bottom:8px;">CEREBRO</div>'
      + 'Connecte-toi d\'abord au <b>Cockpit KW</b> (meme navigateur), puis reviens sur cette page.'
      + '</div>';
    return;
  }
  ReactDOM.createRoot(mount).render(<RadarComptes/>);
}
cerebroBoot();

</script>
</body>
</html>
