<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaizen Way · Mise en situation</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<style>
:root{--bx:#560A0F;--or:#EFB810;--bg:#F7F3F2;--card:#FFFFFF;--tx:#1E1A1A;--mu:#6B6262;--ln:#E4DADA;--me:#560A0F;--th:#F1E9E9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Calibri,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
header{background:var(--bx);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header .brand{font-weight:700;letter-spacing:.04em}
header .brand span{color:var(--or)}
header .meta{font-size:13px;opacity:.85}
main{max-width:860px;margin:0 auto;padding:18px 14px 30px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:24px;color:var(--bx);margin:0 0 10px}
h2{font-size:18px;color:var(--bx);margin:0 0 8px}
p{margin:0 0 10px}
.mu{color:var(--mu);font-size:14px}
.gold{border-left:4px solid var(--or);background:#FDF6E3;padding:12px 14px;border-radius:6px;margin:12px 0}
button{font:inherit;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;background:var(--bx);color:#fff;font-weight:600}
button.sec{background:#fff;color:var(--bx);border:1.5px solid var(--bx)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{font:inherit;padding:10px;border:1px solid var(--ln);border-radius:8px;width:100%;max-width:360px}
.sitbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pill{display:inline-block;background:var(--or);color:#3a2a00;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--bx)}
.timer.warn{color:#B4540A}.timer.over{color:#B00020}
#chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.msg.them{background:var(--th);align-self:flex-start;border-top-left-radius:3px}
.msg.me{background:var(--me);color:#fff;align-self:flex-end;border-top-right-radius:3px}
.msg.sys{align-self:center;background:transparent;color:var(--mu);font-size:13px;font-style:italic}
.who{display:block;font-size:12px;font-weight:700;opacity:.7;margin-bottom:2px}
.compose{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
#mic.rec{background:#B00020;color:#fff;border-color:#B00020;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
#interim{font-size:13px;color:var(--mu);font-style:italic;min-height:18px;margin-top:4px}
textarea{flex:1;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:8px;min-height:52px;max-height:160px;resize:vertical}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.dots:after{content:"…";animation:d 1.2s infinite}
@keyframes d{0%{content:"."}33%{content:".."}66%{content:"..."}}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--ln);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bx);color:#fff}
.score{font-size:40px;font-weight:800;color:var(--bx)}
.elim{background:#FDECEC;border-left:4px solid #B00020;padding:10px 12px;border-radius:6px;margin:10px 0}
.err{color:#B00020;font-size:14px;margin-top:8px}
ul{margin:4px 0 10px 20px;padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171313;--card:#221C1C;--tx:#EFE8E8;--mu:#A99E9E;--ln:#3A2F2F;--th:#2F2626;--me:#7A1820}}
:root[data-theme="dark"]{--bg:#171313;--card:#221C1C;--tx:#EFE8E8;--mu:#A99E9E;--ln:#3A2F2F;--th:#2F2626;--me:#7A1820}
</style>
</head>
<body>
<header><div class="brand">KAIZEN WAY <span>·</span> Mise en situation</div><div class="meta" id="hdrMeta">Responsable Maintenance</div></header>
<main id="app"><div class="card"><p class="dots">Chargement</p></div></main>
<script>
/* KW · Mise en situation Responsable Maintenance · page CANDIDAT v3
   Aucun scénario secret ni grille dans cette page : tout passe par /.netlify/functions/maintenance-candidat */
var SIT = [{"id":"S1","titre":"Le convoyeur qui redéclenche","minutes":14,"perso":"Chef d’équipe de nuit","ouverture":"5h40. Le convoyeur d’alimentation de la ligne 2 s’est arrêté. Le disjoncteur moteur dans l’armoire est déclenché. Mon opérateur l’a réarmé deux fois, ça repart puis ça redéclenche au bout de deux-trois minutes. La ligne est arrêtée et on a un camion à 8h. Tu fais quoi ?","cloture":"Bon, la ligne est relancée, le camion partira. Maintenant, qu’est-ce que tu fais pour que ça ne se reproduise pas ?"},{"id":"S2","titre":"Le défaut intermittent","minutes":14,"perso":"Régleur de la cellule d’assemblage","ouverture":"Depuis trois jours, la cellule d’assemblage s’arrête toute seule six à dix fois par poste. Message sur l’IHM : « Défaut position vérin V3, temps dépassé ». On acquitte, ça repart. L’équipe de jour a changé le capteur de fin de course hier, ça n’a rien changé. Les opérateurs en ont marre.","cloture":"OK, c’est reparti. Et pour que ça ne revienne pas, sur cette cellule et ailleurs, tu fais quoi ?"},{"id":"S3","titre":"Trois appels en même temps","minutes":10,"perso":"Chef de ligne, cariste, responsable logistique","ouverture":"6h05. Tu as deux techniciens disponibles. Trois appels en cinq minutes.\n\nCHEF DE LIGNE 1 (ligne goulot) : « La barrière immatérielle du poste de chargement se met en défaut sans arrêt, la ligne est arrêtée. On a une commande urgente pour notre plus gros client à 10h. Le technicien de nuit dit qu’on peut ponter la barrière, il suffit que tu valides. »\n\nCARISTE : « Il y a une flaque d’huile qui grossit sous la presse 4, juste au bord de l’allée des chariots. »\n\nRESPONSABLE LOGISTIQUE : « Un tiers des luminaires de la zone expédition est éteint depuis ce matin, on y voit mal pour lire les étiquettes. »\n\nTu fais quoi, dans quel ordre, avec qui ?","cloture":"La matinée est passée. Avec le recul, qu’est-ce que tu changes dans ton organisation ?"}];
var CLIENT = "Plantex";
var FN = "/.netlify/functions/maintenance-candidat";
var TOKEN = (new URLSearchParams(location.search).get("c") || "").trim();
var ST = null, timerId = null, busy = false;
var COMP = {pastes: 0, pasted: 0, typed: 0, dictated: 0};
function resetComp(){ COMP = {pastes: 0, pasted: 0, typed: 0, dictated: 0}; }
/* Dictée vocale : reconnaissance du navigateur, aucun audio conservé */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, recOn = false, recHint = "";
function setInterim(t){ var e = document.getElementById("interim"); if (e) e.textContent = t ? "… " + t : (recOn ? "Dictée en cours : parlez, puis cliquez sur ■ pour relire avant d’envoyer." : recHint); }
function micUI(){ var b = document.getElementById("mic"); if (!b) return; b.className = recOn ? "rec" : "sec"; b.textContent = recOn ? "■ Arrêter" : "🎤 Dicter"; setInterim(""); }
function micErr(t){ var e = document.getElementById("err"); if (e) e.textContent = t; }
function micStart(){
  if (!SR || busy) return;
  micErr(""); recHint = "";
  rec = new SR(); rec.lang = "fr-FR"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = function(e){
    var interim = "";
    for (var i = e.resultIndex; i < e.results.length; i++){
      var r = e.results[i];
      if (r.isFinal){
        var t = (r[0].transcript || "").trim(), inp = document.getElementById("inp");
        if (t && inp && !inp.disabled){ var sep = inp.value && !/\s$/.test(inp.value) ? " " : ""; inp.value += sep + t; COMP.dictated += t.length + sep.length; }
      } else interim += r[0].transcript;
    }
    setInterim(interim);
  };
  rec.onerror = function(e){
    if (e.error === "not-allowed" || e.error === "service-not-allowed"){ recOn = false; micUI(); micErr("Accès au micro refusé. Autorisez le micro dans votre navigateur, ou répondez par écrit."); }
    else if (e.error === "network" || e.error === "audio-capture"){ recOn = false; micUI(); micErr("Dictée indisponible (" + e.error + "). Répondez par écrit."); }
  };
  rec.onend = function(){ if (recOn){ try{ rec.start(); }catch(x){ recOn = false; micUI(); } } else micUI(); };
  recOn = true; try{ rec.start(); }catch(x){ recOn = false; }
  micUI();
}
function micStop(){ recOn = false; if (rec){ try{ rec.stop(); }catch(x){} } micUI(); }
var app = document.getElementById("app");
var SKEY = "kw_maint_v3_" + TOKEN;

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function save(){ try{ sessionStorage.setItem(SKEY, JSON.stringify(ST)); }catch(e){} }
function load(){ try{ var v = sessionStorage.getItem(SKEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function clearSave(){ try{ sessionStorage.removeItem(SKEY); }catch(e){} }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

async function api(action, payload, tries){
  var last;
  for (var i = 0; i < (tries || 2); i++){
    try{
      var r = await fetch(FN, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(Object.assign({token: TOKEN, action: action}, payload || {}))});
      var d = await r.json().catch(function(){ return {}; });
      if (r.ok) return d;
      if (r.status >= 400 && r.status < 500) { d.status = r.status; return d; }
      last = new Error(d.error || ("HTTP " + r.status));
    }catch(e){ last = e; }
    await wait(1500);
  }
  throw last;
}
function transcripts(){ /* 3 situations */
  return SIT.map(function(s, i){ var st = ST.sits[i]; return {situation: s.id, titre: s.titre, duree_s: st.dur, cloture_forcee: !!st.forced, messages: st.msgs.slice(1), cloture_question: s.cloture, cloture_reponse: st.cloture, cloture_meta: st.cloture_meta || null}; });
}
async function sync(statut){ try{ await api("save", {statut: statut, client: CLIENT, transcripts: transcripts()}, 3); return true; }catch(e){ return false; } }

function newState(nom){
  return {nom: nom || "", idx: 0, sits: SIT.map(function(s){
    return {id: s.id, phase: "jeu", t0: null, dur: 0, msgs: [{role:"user", content:"[Début de la mise en situation. Le candidat arrive sur place.]"},{role:"assistant", content: s.ouverture}], cloture: ""};
  }), done: false};
}

function screenIntro(nom){
  app.innerHTML =
  '<div class="card"><h1>Mise en situation · Diagnostic de pannes</h1>' +
  '<p class="mu">Poste : Responsable Maintenance · Durée : 45 minutes · 3 situations</p>' +
  (nom ? '<p>Bonjour <b>' + esc(nom) + '</b>.</p>' : '') +
  '<div class="gold"><p>Vous êtes responsable maintenance d’une usine. Vous avez deux techniciens électromécaniciens par poste, une GMAO, un magasin de pièces détachées.</p>' +
  '<p>Vous allez vivre trois situations de terrain. Vos interlocuteurs sont joués par une IA : chef d’équipe, régleur, technicien…</p>' +
  '<p><b>Règle du jeu :</b> vous disposez de tous les outils et documents habituels (multimètre, pince ampèremétrique, mégohmmètre, manomètre, caméra thermique, schémas, IHM, GMAO). Votre interlocuteur ne vous donnera une information <b>que si vous la demandez</b> ou si vous lui dites <b>quelle vérification vous faites</b>. Dites concrètement ce que vous faites, avec quel instrument, et ce que vous en concluez.</p>' +
  '<p>Quand vous estimez la situation traitée, cliquez sur « Situation traitée » puis confirmez. Une dernière question vous sera posée, puis vous passerez à la suivante.</p></div>' +
  '<p class="mu">Seul votre raisonnement compte. Un chronomètre s’affiche par situation : chaque situation est clôturée automatiquement une minute après son temps prévu. Vous pouvez écrire ou dicter vos réponses (bouton 🎤, navigateurs Chrome, Edge ou Safari) puis les relire et les corriger avant envoi ; la dictée utilise la reconnaissance vocale de votre navigateur et aucun enregistrement audio n’est conservé. Les collages de texte dans la zone de réponse sont enregistrés. Prévoyez 45 minutes sans interruption ; si la page se ferme, rouvrez votre lien dans le même onglet pour reprendre.</p>' +
  '<button id="go">Commencer</button></div>';
  document.getElementById("go").onclick = function(){ ST = newState(nom); ST.t_start = Date.now(); save(); sync("en_cours"); screenSit(); };
}

function screenSit(){
  if (recOn) micStop();
  resetComp();
  var s = SIT[ST.idx], st = ST.sits[ST.idx];
  if (!st.t0) { st.t0 = Date.now(); save(); }
  document.getElementById("hdrMeta").textContent = "Situation " + (ST.idx + 1) + " / " + SIT.length;
  app.innerHTML =
  '<div class="card"><div class="sitbar"><div><span class="pill">' + s.id + '</span> <b>' + esc(s.titre) + '</b><div class="mu">Interlocuteur : ' + esc(s.perso) + '</div></div>' +
  '<div style="text-align:right"><div class="timer" id="tm">00:00 / ' + s.minutes + ':00</div><div class="mu" id="gt"></div></div></div>' +
  '<div id="chat"></div>' +
  '<div class="compose"><textarea id="inp" placeholder="Écrivez ou dictez ce que vous dites ou faites…"></textarea>' + (SR ? '<button class="sec" id="mic" type="button">🎤 Dicter</button>' : '') + '<button id="send">Envoyer</button></div><div id="interim"></div>' +
  '<div class="err" id="err"></div>' +
  '<div class="actions"><span class="mu">Entrée pour envoyer · Maj+Entrée pour aller à la ligne' + (SR ? '' : ' · Dictée vocale non disponible sur ce navigateur') + '</span>' +
  '<button class="sec" id="fin">Situation traitée</button></div></div>';
  renderChat();
  var inp = document.getElementById("inp");
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
  inp.addEventListener("paste", function(e){ var t = (e.clipboardData && e.clipboardData.getData("text")) || ""; COMP.pastes++; COMP.pasted += t.length; });
  inp.addEventListener("drop", function(e){ var t = (e.dataTransfer && e.dataTransfer.getData("text")) || ""; COMP.pastes++; COMP.pasted += t.length; });
  inp.addEventListener("input", function(e){ var it = e.inputType || ""; if ((it === "insertText" || it === "insertCompositionText" || it === "insertReplacementText") && e.data) COMP.typed += e.data.length; else if (it === "insertLineBreak") COMP.typed += 1; });
  document.getElementById("send").onclick = send;
  var mb = document.getElementById("mic"); if (mb) mb.onclick = function(){ recOn ? micStop() : micStart(); };
  var armTimer = null;
  document.getElementById("fin").onclick = function(){
    if (st.phase !== "jeu" || busy) return;
    var b = this;
    if (b.dataset.armed !== "1"){
      b.dataset.armed = "1"; b.textContent = "Confirmer : situation traitée ?"; b.className = "";
      clearTimeout(armTimer);
      armTimer = setTimeout(function(){ if (b.dataset.armed === "1"){ b.dataset.armed = ""; b.textContent = "Situation traitée"; b.className = "sec"; } }, 5000);
      return;
    }
    clearTimeout(armTimer); b.dataset.armed = ""; openCloture();
  };
  if (st.phase !== "jeu") document.getElementById("fin").disabled = true;
  if (st.phase === "fini") showNext();
  startTimer(); inp.focus();
}

function renderChat(){
  var st = ST.sits[ST.idx], s = SIT[ST.idx], h = "";
  st.msgs.forEach(function(m, i){
    if (i === 0) return;
    if (m.role === "assistant") h += '<div class="msg them"><span class="who">' + esc(s.perso) + '</span>' + esc(m.content) + '</div>';
    else h += '<div class="msg me">' + esc(m.content) + '</div>';
  });
  if (st.phase !== "jeu") {
    h += '<div class="msg them"><span class="who">' + esc(s.perso) + '</span>' + esc(s.cloture) + '</div>';
    if (st.cloture) h += '<div class="msg me">' + esc(st.cloture) + '</div><div class="msg sys">Réponse enregistrée.</div>';
  }
  if (busy) h += '<div class="msg them"><span class="dots">…</span></div>';
  var c = document.getElementById("chat"); c.innerHTML = h; c.scrollTop = c.scrollHeight;
}

function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(function(){
    var s = SIT[ST.idx], st = ST.sits[ST.idx], el = document.getElementById("tm");
    if (!el || !st.t0) return;
    var sec = Math.floor((Date.now() - st.t0) / 1000), lim = s.minutes * 60;
    el.textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0") + " / " + s.minutes + ":00";
    el.className = "timer" + (sec > lim ? " over" : (sec > lim * 0.8 ? " warn" : ""));
    var tot = ST.t_start ? Math.floor((Date.now() - ST.t_start) / 1000) : 0, gl = document.getElementById("gt");
    if (gl) { gl.textContent = "Temps total " + String(Math.floor(tot / 60)).padStart(2, "0") + ":" + String(tot % 60).padStart(2, "0") + " / 45:00"; gl.className = "mu" + (tot > 2700 ? " err" : ""); }
    if (st.phase === "jeu" && (sec > lim + 60 || tot > 2760) && !busy) openCloture(true);
  }, 1000);
}

function openCloture(forced){
  var st = ST.sits[ST.idx];
  st.phase = "cloture"; st.dur = Math.round((Date.now() - st.t0) / 1000); st.forced = !!forced; save();
  var f = document.getElementById("fin"); if (f) f.disabled = true;
  renderChat();
  var inp = document.getElementById("inp"); inp.placeholder = "Votre réponse…"; inp.focus();
}

async function send(){
  var inp = document.getElementById("inp"), err = document.getElementById("err");
  if (recOn){ recHint = "Dictée arrêtée : relisez votre texte puis cliquez sur Envoyer."; micStop(); return; }
  recHint = ""; setInterim("");
  var txt = inp.value.trim(); if (!txt || busy) return;
  var st = ST.sits[ST.idx];
  err.textContent = "";
  var meta = {t: Date.now(), len: txt.length, pastes: COMP.pastes, pasted: COMP.pasted, typed: COMP.typed, dictated: COMP.dictated};
  if (st.phase === "cloture"){ st.cloture = txt; st.cloture_meta = meta; resetComp(); st.phase = "fini"; inp.value = ""; save(); renderChat(); showNext(); sync("en_cours"); return; }
  if (st.phase !== "jeu") return;
  st.msgs.push({role:"user", content: txt, meta: meta}); resetComp(); inp.value = ""; busy = true; save(); renderChat(); lock(true);
  try{
    var d = await api("chat", {situation: ST.idx, messages: st.msgs});
    if (!d.text) throw new Error(d.error || "Réponse vide");
    st.msgs.push({role:"assistant", content: d.text, meta: {t: Date.now()}});
  }catch(e){
    st.msgs.pop(); inp.value = txt; COMP = {pastes: meta.pastes, pasted: meta.pasted, typed: meta.typed, dictated: meta.dictated};
    err.textContent = "Connexion perdue, votre message n’a pas été transmis. Renvoyez-le.";
  }
  busy = false; save(); renderChat(); lock(false); inp.focus();
}
function lock(b){ ["send","fin","mic"].forEach(function(id){ var e = document.getElementById(id); if (e && !(id === "fin" && ST.sits[ST.idx].phase !== "jeu")) e.disabled = b; }); }

function showNext(){
  if (recOn) micStop(); var mbn = document.getElementById("mic"); if (mbn) mbn.disabled = true;
  document.getElementById("inp").disabled = true; document.getElementById("send").disabled = true;
  var last = ST.idx === SIT.length - 1;
  var a = document.querySelector(".actions");
  a.innerHTML = '<span class="mu">Situation ' + SIT[ST.idx].id + ' terminée.</span><button id="nx">' + (last ? "Terminer l’épreuve" : "Situation suivante") + '</button>';
  document.getElementById("nx").onclick = function(){ if (last) { finish(); return; } ST.idx++; save(); screenSit(); };
}

async function finish(){
  if (recOn) micStop();
  clearInterval(timerId);
  document.getElementById("hdrMeta").textContent = "Épreuve terminée";
  app.innerHTML = '<div class="card"><h2>Merci.</h2><p class="dots">Enregistrement de votre épreuve</p><p class="mu">Ne fermez pas la page.</p></div>';
  var ok = await sync("termine");
  if (!ok){
    app.innerHTML = '<div class="card"><h2>Enregistrement impossible</h2><p>Vos réponses sont conservées dans cette page. Vérifiez votre connexion puis réessayez.</p><button id="rt">Réessayer</button></div>';
    document.getElementById("rt").onclick = finish; return;
  }
  ST.done = true; clearSave();
  app.innerHTML = '<div class="card"><h2>Épreuve terminée</h2><p>Merci ' + esc(ST.nom || "") + '. Vos réponses ont été enregistrées et seront analysées par l’équipe Kaizen Way.</p><p class="mu">Vous pouvez fermer cette page.</p></div>';
}

(async function(){
  if (!TOKEN){ app.innerHTML = '<div class="card"><h2>Lien invalide</h2><p>Utilisez le lien personnel qui vous a été transmis.</p></div>'; return; }
  var v;
  try{ v = await api("check"); }catch(e){ app.innerHTML = '<div class="card"><h2>Service momentanément indisponible</h2><p>Réessayez dans quelques minutes.</p></div>'; return; }
  if (!v.valid){ app.innerHTML = '<div class="card"><h2>Accès impossible</h2><p>' + esc(v.error || "Lien invalide.") + '</p></div>'; return; }
  if (v.termine){ clearSave(); app.innerHTML = '<div class="card"><h2>Épreuve déjà réalisée</h2><p>Vos réponses ont bien été enregistrées. Merci.</p></div>'; return; }
  var prev = load();
  if (prev && !prev.done){ ST = prev; screenSit(); return; }
  screenIntro(v.nom);
})();
</script>
</body>
</html>
