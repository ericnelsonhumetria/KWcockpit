  to = "/.netlify/functions/action-relance"
  status = 200
  
[functions."cerebro-watch"]
  schedule = "45 4 * * 1"
# Cerebro Events : veille + e-mail chaque lundi 05:00 UTC (06h-07h Paris)
[functions."cerebro-events-watch"]
  schedule = "0 5 * * 1"

# Cerebro People : synchronisation LinkedIn, tous les jours 05:15 UTC. Le lundi : tout le monde. Les autres jours : seulement les connexions
# « en attente » (LinkedIn prépare les données) ou « en erreur » (nouvel essai rapide).
[functions."cerebro-linkedin-weekly"]
  schedule = "15 5 * * *"

# Clap! : notifications « actions en retard » sur le téléphone (Web Push). Temps réel : déclencheur SQL -> push-actions.
[[redirects]]
  from = "/api/push-actions"
  to = "/.netlify/functions/push-actions"
  status = 200
# Notifications du téléphone : toutes les 2 h de 7h à 21h (Paris) on remet celles qui ont été effacées ; vers minuit, les échéances de la veille passent « en retard »
[functions."push-actions-daily"]
  schedule = "10 5-19/2,23 * * *"
