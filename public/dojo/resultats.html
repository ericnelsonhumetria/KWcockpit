const G={gold:'#E8A800',burg:'#6B1020',bg:'#f7f4f0',panel:'#fff',border:'#ddd0c4',text:'#1a1008',dim:'#5a4030',faint:'#8a7868'};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
/* Une ligne de dojo_resultats → l'objet attendu par les écrans d'origine */
function fmt(r){
  var ev = r.evaluation || null;
  return {
    subId: String(r.id || ''),
    email: r.email || '',
    consultant: r.consultant || '—',
    scenario: r.scenario || '—',
    tag: r.tag || '',
    industrie: r.industrie || '—',
    date: r.date_texte || (r.created_at || '').slice(0, 10) || '—',
    score: r.score || '—',
    ev: ev,
    transcript: r.transcript || '',
    created: r.created_at || ''
  };
}
/* ICC : celui calculé et montré au consultant à la fin de sa simulation ; à défaut, recalculé */
function iccOf(ev){ return (ev && typeof ev.icc === 'number') ? ev.icc : calcICC(ev); }

let submissions = [];
let archived = new Set(JSON.parse((function(){ try { return localStorage.getItem('kw_archived') || '[]'; } catch(e){ return '[]'; } })()));
let showArchived = false;
let activeTab = 'coaching';
function saveArchived(){ try { localStorage.setItem('kw_archived', JSON.stringify([...archived])); } catch(e){} }
function toggleArchive(subId, e){ e.stopPropagation(); const sid = String(subId); if (archived.has(sid)) archived.delete(sid); else archived.add(sid); saveArchived(); renderDashboard(); }
function setTab(tab){
  activeTab = tab;
  ['coaching','dashboard'].forEach(t => { const v = document.getElementById('tab-view-'+t); if (v) v.style.display = t === tab ? 'block' : 'none'; });
  if (tab === 'dashboard') renderDashboardView();
  ['coaching','dashboard'].forEach(t => { const b = document.getElementById('tab-'+t); if (b){ b.style.background = t === tab ? '#E8A800' : 'rgba(255,255,255,0.15)'; b.style.color = t === tab ? '#000' : '#c09098'; } });
}
function message(html){
  document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:${G.bg};">
    <div style="width:100%;max-width:420px;text-align:center;"><img src="${LOGO}" style="height:44px;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto;"/>

const stars=(n,max=5)=>Array.from({length:max},(_,i)=>`<span style="color:${i<n?G.gold:'#ddd'};font-size:14px;">★</span>`).join('');


const ICC_WEIGHTS = [1, 2, 1, 1, 1, 2, 1, 1]; // ×2 sur Ancrage factuel (idx 1) et Co-construction plan perf (idx 5)

function calcICC(ev) {
  if (!ev || !ev.criteres || !ev.criteres.length) return null;
  let total = 0, max = 0;
  ev.criteres.forEach((c, i) => {
    const w = ICC_WEIGHTS[i] || 1;
    total += (c.score || 0) * w;
    max   += 5 * w;
  });
  let icc = Math.round((total / max) * 100);

  // Cap : critères pondérés ≤ 1 → plafond 50% / faute grave → plafond 35%
  const c1 = ev.criteres[1]?.score || 0;
  const c5 = ev.criteres[5]?.score || 0;
  if (c1 <= 1 && c5 <= 1) icc = Math.min(icc, 50);
  if (c1 === 0 || c5 === 0) icc = Math.min(icc, 35);

  const secs = ev.debSeconds;
  if (secs) {
    const mins = secs / 60;
    if (mins > 30 || (mins < 5 && mins > 0)) icc = Math.max(0, icc - 10);
  }
  return icc;
}

function parseRapport(text) {
  if (!text) return null;
  try {
    const lines = text.split('\n');
    // Score
    // No scoreGlobal in new reports — use ICC line if present
    const iccLine = lines.find(l => l.includes('ICC'));
    const iccMatch = iccLine && iccLine.match(/(\d+)%/);
    const scoreGlobal = iccMatch ? Math.round(parseInt(iccMatch[1]) / 20) : 0; // convert % to /5 approx
    // Appreciation (after ICC or first substantive line)
    const sIdx = lines.findIndex(l => l.includes('SYNTHÈSE') || l.includes('appreciation'));
    const appreciation = sIdx >= 0 ? lines[sIdx+1]?.trim() || '' : lines.find(l => l.length > 50 && !l.includes('=') && !l.includes('Consultant') && !l.includes('Date') && !l.includes('ICC')) || '';
    // Points forts
    const pfIdx = lines.findIndex(l => l.trim() === 'POINTS FORTS');
    const axIdx = lines.findIndex((l,i) => i>pfIdx && l.trim() === 'AXES DE DÉVELOPPEMENT');
    const pointsForts = lines.slice(pfIdx+1, axIdx).filter(l=>l.trim().startsWith('+')).map(l=>l.replace(/^\s*\+\s*/,''));
    // Axes
    const crIdx = lines.findIndex((l,i) => i>axIdx && l.trim() === 'CRITÈRES DÉTAILLÉS');
    const axes = lines.slice(axIdx+1, crIdx).filter(l=>l.trim().startsWith('△')).map(l=>l.replace(/^\s*△\s*/,''));
    // Critères
    const coIdx = lines.findIndex((l,i) => i>crIdx && l.trim() === 'CONSEIL');
    const critLines = lines.slice(crIdx+1, coIdx).filter(l=>l.trim());
    const criteres = [];
    for (let i=0; i<critLines.length; i++) {
      const m = critLines[i].match(/(\d)\/5/);
      if (m) {
        const score = parseInt(m[1]);
        const nom = critLines[i].split(/[★☆]/)[0].trim();
        const commentaire = critLines[i+1]?.trim() || '';
        if (nom) { criteres.push({nom, score, commentaire}); i++; }
      }
    }
    // Conseil
    const conseil = lines[coIdx+1]?.trim().replace(/^"|"$/g,'') || '';
    // Extract ICC malus line
    const malusLine = lines.find(l => l.includes('Malus durée'));
    const debMalusReason = malusLine ? malusLine.replace(/^.*Malus durée\s*:\s*/,'').trim() : null;
    // Extract debrief time
    const debLine = lines.find(l => l.includes('Durée débrief'));
    const debTime = debLine ? debLine.replace(/^.*Durée débrief\s*:\s*/,'').trim() : null;
    if (!appreciation && !pointsForts.length) return null;
    return {appreciation, pointsForts, axes, criteres, conseil, debTime, debMalus: debMalusReason ? {active:true, reason:debMalusReason} : null};
  } catch(e) { return null; }
}

function parseTranscript(text) {
  if (!text) return [];
  return text.split('\n\n').filter(l=>l.trim()).map(line => {
    const isConsultant = line.startsWith('CONSULTANT KW:');
    const content = line.replace(/^(CONSULTANT KW:|[^:]+:)/, '').trim();
    return { isConsultant, content };
  });
}

function sendRapport(r) {
  if (!r) return;
  const email = r.email || '';
  const ev = r.ev;
  const stars = n => '★'.repeat(n||0)+'☆'.repeat(5-(n||0));
  const icc = ev ? (iccOf(ev) ?? '—') : '—';

  const ptsForts = ev?.pointsForts?.map(p => '  + '+p).join('\n') || '';
  const axes = ev?.axes?.map(a => '  △ '+a).join('\n') || '';
  const criteres = ev?.criteres?.map(c =>
    '  '+c.nom.padEnd(30)+stars(c.score)+' '+c.score+'/5\n     '+c.commentaire
  ).join('\n\n') || '';

  const body = [
    'KAIZEN WAY — RAPPORT DE DÉBRIEF',
    '='.repeat(48),
    '',
    'Consultant  : '+r.consultant,
    'Scénario    : '+r.scenario,
    'Industrie   : '+r.industrie,
    'Date        : '+r.date,
    '',
    'ICC — Indicateur de Comportement de Coach : '+icc+'%',
    ev ? ('Moyenne par critère : '+Math.round(ev.criteres.reduce((s,c)=>s+(c.score||0),0)/ev.criteres.length*10)/10+'/5') : '',
    '',
    'SYNTHÈSE',
    (ev?.appreciation || r.rapport?.split('\n').find(l=>l && !l.startsWith('=') && !l.startsWith('KAIZEN') && !l.startsWith('Consultant') && !l.startsWith('Scénario') && !l.startsWith('Industrie') && !l.startsWith('Date') && !l.startsWith('ICC') && !l.startsWith('SCORE') && l.length > 30) || ''),
    '',
    'POINTS FORTS',
    ptsForts,
    '',
    'AXES DE DÉVELOPPEMENT',
    axes,
    '',
    'CRITÈRES DÉTAILLÉS',
    criteres,
    '',
    ev?.conseil ? 'CONSEIL POUR LE PROCHAIN DÉBRIEF\n  "'+ev.conseil+'"' : '',
    '',
    '─'.repeat(48),
    "Kaizen Way · Module Coaching Chef d'Équipe · Simulation IA"
  ].join('\n');

  const subject = encodeURIComponent('[KW Coaching] '+r.consultant+' — '+r.scenario+' — ICC '+icc+'%');
  window.open('mailto:'+email+'?subject='+subject+'&body='+encodeURIComponent(body));
}

function loadChartJs(cb){
  if(chartJsLoaded){cb();return;}
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
  s.onload=function(){chartJsLoaded=true;cb();};
  document.head.appendChild(s);
}

function iccColor(v){return v>=65?C_OK:v>=45?C_WARN:C_DANGER;}
function scoreColor(v){return v>=4?C_OK:v>=3?C_ACCENT:v>=2?C_WARN:C_DANGER;}

function renderDashboardView(){
  const el=document.getElementById('tab-view-dashboard');
  if(!el) return;
  if(!window.allFmt||!window.allFmt.length){
    el.innerHTML='<div style="padding:40px;color:#666;font-family:monospace;font-size:12px;">Aucune donnée disponible. Aucune simulation enregistrée.</div>';
    return;
  }
  loadChartJs(function(){
    try { buildDashboard(el); }
    catch(e) { el.innerHTML='<div style="padding:40px;color:#f06060;font-family:monospace;font-size:12px;">Erreur dashboard: '+e.message+'</div>'; }
  });
}

function saveDashArchive(a){localStorage.setItem('kw_dash_archive',JSON.stringify(a));}
function toggleDashArchive(type,id){

    // Skip archived sessions
    if(dashArch.sessions&&dashArch.sessions[d.subId]) return;

  const consultants=Object.keys(byC).sort();

  // Collect all ICC scores for global stats

      const critEl=document.getElementById(cCritIds[k]);
      if(critEl){
        const datasets=raps.length===1
          ?[{data:raps[0].ev&&raps[0].ev.criteres?raps[0].ev.criteres.map(function(c){return c.score||0;}):[],backgroundColor:raps[0].ev&&raps[0].ev.criteres?raps[0].ev.criteres.map(function(c){return scoreColor(c.score||0);}):[], borderRadius:4,borderSkipped:false}]
          :raps.map(function(d,i){const cols=[C_ACCENT+'99',C_BLUE+'99','#f0b86099','#60d4a099'];return {label:d.scenario,data:d.ev&&d.ev.criteres?d.ev.criteres.map(function(c){return c.score||0;}):[],backgroundColor:cols[i%cols.length],borderRadius:3,borderSkipped:false};});
        const showLegend=raps.length>1;
        new Chart(critEl,{type:'bar',data:{labels:CRITERIA_SHORT,datasets:datasets},
          options:{...chartOpts,plugins:{legend:{display:showLegend,labels:{color:C_MUTED,font:{family:'monospace',size:9},boxWidth:10,boxHeight:10}}},
            scales:{x:{...chartOpts.scales.x},y:{min:0,max:5,ticks:{color:C_MUTED,font:{family:'monospace',size:10},stepSize:1},grid:{color:C_GRID}}}}});
      }
    });
  },100);
}

/* ── IMPORT DE L'HISTORIQUE DE L'ANCIEN DOJO (direction uniquement) ──────────────────────────────
   Lit les rapports « kw-rapport » de l'ancien site Netlify (dojo-consultants-kw) avec un jeton Netlify saisi ICI (jamais enregistré,
   jamais envoyé ailleurs qu'à api.netlify.com), rattache chaque consultant à son e-mail (fiche Admin → Pilotes), puis les enregistre
   dans dojo_resultats via dojo_importer() (dojo_import.sql). Un rapport déjà importé n'est jamais dupliqué. */
var IMP = { token:'', rows:[], sites:[] };
function impNorm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function impKey(s){ return impNorm(s).split(' ').filter(Boolean).sort().join(' '); }
function impPanel(html, titre){ titre = titre || 'IMPORTER L’HISTORIQUE DE L’ANCIEN DOJO';
  var ov = document.getElementById('impOv');
  if (!ov){ ov = document.createElement('div'); ov.id = 'impOv'; ov.style.cssText = 'position:fixed;inset:0;background:rgba(26,16,8,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;'; document.body.appendChild(ov); }
  ov.innerHTML = '<div role="dialog" aria-modal="true" aria-label="' + titre + '" style="background:#fff;border-radius:4px;max-width:720px;width:100%;padding:22px 22px 18px;font-size:14px;line-height:1.55;color:#1a1008;box-shadow:0 10px 40px rgba(0,0,0,.25);">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div style="font-family:monospace;font-size:10px;color:#E8A800;letter-spacing:2.5px;">' + titre + '</div>'
    + '<button onclick="impClose()" aria-label="Fermer" style="background:none;border:none;font-size:20px;cursor:pointer;color:#8a7868;">×</button></div>' + html + '</div>';
}
function impClose(){ var ov = document.getElementById('impOv'); if (ov) ov.remove(); IMP.token = ''; }
function impBtn(label, fn, ghost){ return '<button onclick="' + fn + '" style="' + (ghost ? 'background:#fff;color:#6B1020;' : 'background:#6B1020;color:#fff;') + 'border:1px solid #6B1020;padding:9px 16px;font-family:monospace;font-size:10px;letter-spacing:1px;cursor:pointer;border-radius:2px;margin-right:8px;">' + label + '</button>'; }
function impOpen(){
  impPanel('<p style="margin-bottom:10px;">Les simulations de l’ancien site <b>dojo-consultants-kw</b> sont dans ses formulaires Netlify. Pour les lire, collez un <b>jeton d’accès Netlify</b> : Netlify → photo de profil → <i>User settings</i> → <i>Applications</i> → <i>Personal access tokens</i> → <i>New access token</i> (expiration : 1 jour).</p>'
    + '<p style="margin-bottom:12px;font-size:12px;color:#8a7868;">Le jeton reste dans cette page : il n’est ni enregistré, ni envoyé ailleurs qu’à Netlify. Supprimez-le sur Netlify après l’import.</p>'
    + '<input id="impTok" type="password" autocomplete="off" placeholder="Jeton Netlify" style="width:100%;background:#f7f4f0;border:1px solid #ddd0c4;padding:10px 12px;border-radius:2px;font-family:monospace;font-size:12px;margin-bottom:12px;"/>'
    + impBtn('LIRE L’ANCIEN DOJO →', 'impSites()') + '<div id="impErr" role="alert" style="color:#c04040;font-size:12px;margin-top:10px;"></div>');
  setTimeout(function(){ var t = document.getElementById('impTok'); if (t) t.focus(); }, 0);
}
async function impApi(path){
  var r = await fetch('https://api.netlify.com/api/v1' + path, { headers:{ Authorization:'Bearer ' + IMP.token } });
  if (r.status === 401) throw new Error('Jeton Netlify refusé (expiré ou incomplet).');
  if (!r.ok) throw new Error('Netlify a répondu ' + r.status + '.');
  return r.json();
}
function impErr(m){ var e = document.getElementById('impErr'); if (e) e.textContent = m; }
async function impSites(){
  var t = document.getElementById('impTok'); IMP.token = t ? t.value.trim() : IMP.token;
  if (!IMP.token){ impErr('Collez le jeton Netlify.'); return; }
  impErr('Lecture des sites…');
  try {
    IMP.sites = await impApi('/sites?per_page=100&filter=all');
    var opts = IMP.sites.map(function(s){ return '<option value="' + esc(s.id) + '"' + (s.name === 'dojo-consultants-kw' ? ' selected' : '') + '>' + esc(s.name) + ' — ' + esc(s.default_domain || '') + '</option>'; }).join('');
    impPanel('<label for="impSite" style="display:block;font-family:monospace;font-size:10px;letter-spacing:1.5px;color:#5a4030;margin-bottom:6px;">SITE DE L’ANCIEN DOJO</label>'
      + '<select id="impSite" style="width:100%;background:#f7f4f0;border:1px solid #ddd0c4;padding:10px 12px;border-radius:2px;font-size:14px;margin-bottom:14px;">' + opts + '</select>'
      + impBtn('LIRE LES RAPPORTS →', 'impLire()') + impBtn('ANNULER', 'impClose()', true) + '<div id="impErr" role="alert" style="color:#c04040;font-size:12px;margin-top:10px;"></div>');
  } catch(e){ impErr(e.message || String(e)); }
}
async function impEmails(){
  var map = {};
  try {
    var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    var p = await sb.from('action_pilotes').select('nom,email');
    ((p && p.data) || []).forEach(function(x){ if (x.nom && x.email) map[impKey(x.nom)] = String(x.email).trim().toLowerCase(); });
    var u = await sb.from('user_access').select('email');
    ((u && u.data) || []).forEach(function(x){ var em = String(x.email || '').trim().toLowerCase(); if (!em) return; var k = impKey(em.split('@')[0]); if (k && !map[k]) map[k] = em; });
  } catch(e){}
  return map;
}
async function impLire(){
  var sel = document.getElementById('impSite'), site = sel ? sel.value : ''; impErr('Lecture des rapports…');
  try {
    var forms = await impApi('/sites/' + site + '/forms'), form = forms.filter(function(f){ return f.name === 'kw-rapport'; })[0];
    if (!form) throw new Error('Aucun formulaire « kw-rapport » sur ce site.');
    var subs = [], page = 1, lot;
    do { lot = await impApi('/forms/' + form.id + '/submissions?per_page=100&page=' + page); subs = subs.concat(lot); page++; } while (lot.length === 100 && page < 50);
    var emails = await impEmails();
    IMP.rows = subs.map(function(sub){
      var d = sub.data || {}, ev = null;
      try { if (d.evaluation_json) ev = JSON.parse(d.evaluation_json); } catch(e){}
      if (!ev && d.rapport){ ev = parseRapport(d.rapport); var mi = /ICC[^\n]*?(\d{1,3})\s*%/.exec(d.rapport); if (ev && mi) ev.icc = +mi[1]; }   /* rapport texte : l'ICC écrit dans le rapport fait foi */
      if (ev && typeof ev.icc !== 'number'){ var v = calcICC(ev); if (v !== null) ev.icc = v; }
      var cons = String(d.consultant || '').trim(), sc = String(d.scenario || '');
      var mail = (cons.indexOf('@') > 0 ? cons.toLowerCase() : '') || emails[impKey(cons)] || '';
      return { source_id:String(sub.id || sub.number || ''), created_at:sub.created_at || null, email:mail, consultant:cons || '—',
               scenario:sc.split(' — ')[0] || '—', tag:sc.split(' — ')[1] || '', industrie:d.industrie || '', date_texte:d.date || (sub.created_at || '').slice(0, 10),
               score:d.score || (ev && typeof ev.icc === 'number' ? ev.icc + '%' : ''), evaluation:ev, transcript:d.transcript || '' };
    }).filter(function(r){ return r.source_id; });
    var par = {}; IMP.rows.forEach(function(r){ var k = r.consultant; (par[k] = par[k] || { n:0, email:r.email }).n++; });
    var lignes = Object.keys(par).sort().map(function(k){ var x = par[k]; return '<tr><td style="padding:4px 8px;">' + esc(k) + '</td><td style="padding:4px 8px;text-align:right;">' + x.n + '</td><td style="padding:4px 8px;' + (x.email ? '' : 'color:#c04040;') + '">' + (x.email ? esc(x.email) : 'non rattaché') + '</td></tr>'; }).join('');
    var sansMail = IMP.rows.filter(function(r){ return !r.email; }).length;
    impPanel('<p style="margin-bottom:10px;"><b>' + IMP.rows.length + '</b> simulation(s) trouvée(s) pour <b>' + Object.keys(par).length + '</b> consultant(s).</p>'
      + '<div style="max-height:320px;overflow:auto;border:1px solid #ddd0c4;border-radius:2px;margin-bottom:10px;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="background:#faf8f5;"><th style="text-align:left;padding:6px 8px;">Consultant</th><th style="text-align:right;padding:6px 8px;">Simulations</th><th style="text-align:left;padding:6px 8px;">Rattaché à</th></tr></thead><tbody>' + lignes + '</tbody></table></div>'
      + (sansMail ? '<p style="font-size:12px;color:#8a7868;margin-bottom:12px;">« Non rattaché » : aucune fiche Admin → Pilotes à ce nom. Ces simulations seront importées et visibles des personnes qui ont le droit « Dojo — résultats », mais pas du consultant lui-même. Pour les rattacher, créez sa fiche Pilote puis relancez : rien ne sera dupliqué.</p>' : '')
      + impBtn('IMPORTER ' + IMP.rows.length + ' SIMULATION(S)', 'impGo()') + impBtn('ANNULER', 'impClose()', true) + '<div id="impErr" role="alert" style="color:#c04040;font-size:12px;margin-top:10px;"></div>');
  } catch(e){ impErr(e.message || String(e)); }
}
async function impGo(){
  impErr('Import en cours…');
  try {
    var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY), tot = { importes:0, ignores:0 };
    for (var i = 0; i < IMP.rows.length; i += 50){
      var r = await sb.rpc('dojo_importer', { p_lignes: IMP.rows.slice(i, i + 50) });
      if (r.error) throw new Error(/function|schema cache/i.test(r.error.message) ? 'Exécutez d’abord dojo_import.sql dans Supabase.' : r.error.message);
      tot.importes += (r.data && r.data.importes) || 0; tot.ignores += (r.data && r.data.ignores) || 0;
    }
    impPanel('<p style="margin-bottom:14px;">✓ <b>' + tot.importes + '</b> simulation(s) importée(s)' + (tot.ignores ? ' · ' + tot.ignores + ' déjà présente(s), ignorée(s)' : '') + '.</p>'
      + '<p style="font-size:12px;color:#8a7868;margin-bottom:14px;">Pensez à supprimer le jeton sur Netlify (User settings → Applications).</p>' + impBtn('VOIR LES RÉSULTATS', 'impClose();loadAndRender()'));
    IMP.token = '';
  } catch(e){ impErr(e.message || String(e)); }
}


/* ── SUPPRESSION (direction uniquement) : définitive, via dojo_supprimer() (dojo_suppression.sql).
   Un rapport de l'ancien Dojo supprimé n'est jamais réimporté. */
function canDel(){ return !!(KW_ACCES && KW_ACCES.direction); }
function delAsk(btn){
  var ids = String(btn.getAttribute('data-ids') || '').split(',').filter(Boolean), label = btn.getAttribute('data-label') || '';
  if (!ids.length) return;
  impPanel('<p style="margin-bottom:8px;">Supprimer définitivement <b>' + esc(label) + '</b> ?</p>'
    + '<p style="font-size:12px;color:#8a7868;margin-bottom:14px;">' + ids.length + ' simulation' + (ids.length > 1 ? 's' : '') + ' : évaluation et verbatim effacés pour tout le monde. Cette action ne peut pas être annulée'
    + ' (contrairement à « Archiver », qui masque seulement l’affichage sur ce poste).</p>'
    + '<button id="delOk" style="background:#c0392b;color:#fff;border:1px solid #c0392b;padding:9px 16px;font-family:monospace;font-size:10px;letter-spacing:1px;cursor:pointer;border-radius:2px;margin-right:8px;">SUPPRIMER</button>'
    + impBtn('ANNULER', 'impClose()', true) + '<div id="impErr" role="alert" style="color:#c04040;font-size:12px;margin-top:10px;"></div>', 'SUPPRIMER DES SIMULATIONS');
  var ok = document.getElementById('delOk');
  ok.onclick = function(){ delGo(ids); };
  setTimeout(function(){ var c = document.querySelector('#impOv button[onclick="impClose()"]:last-of-type'); if (c) c.focus(); }, 0);
}
async function delGo(ids){
  var ok = document.getElementById('delOk'); if (ok) ok.disabled = true;
  impErr('Suppression…');
  try {
    var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    var r = await sb.rpc('dojo_supprimer', { p_ids: ids });
    if (r.error) throw new Error(/function|schema cache/i.test(r.error.message) ? 'Exécutez d’abord dojo_suppression.sql dans Supabase.' : r.error.message);
    ids.forEach(function(id){ archived.delete(String(id)); }); saveArchived();
    impClose(); await loadAndRender();
  } catch(e){ if (ok) ok.disabled = false; impErr(e.message || String(e)); }
}


loadAndRender();
</script>
